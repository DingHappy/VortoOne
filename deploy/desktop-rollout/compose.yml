services:
  desktop-rollout:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${ROLLOUT_BIND_ADDRESS:-127.0.0.1}:8096:8096"
    environment:
      ROLLOUT_DATA_DIR: /data
      ROLLOUT_ADMIN_PASSWORD_HASH: "${ROLLOUT_ADMIN_PASSWORD_HASH:?Set the admin password hash}"
    volumes:
      - "${ROLLOUT_DATA_DIR:?Set the private rollout data directory}:/data"
