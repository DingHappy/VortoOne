<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VortoOne · 灰度更新</title>
  <link rel="stylesheet" href="/admin/releases/style.css">
  <script type="module" src="/admin/releases/app.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="brand">VortoOne</p>
        <h1>灰度更新</h1>
      </div>
      <button id="logout" class="secondary" type="button" hidden>退出登录</button>
    </header>

    <p id="notice" class="notice" role="status" aria-atomic="true" hidden></p>

    <div id="dashboard" hidden>
      <section class="panel" aria-labelledby="device-title">
        <div class="section-header">
          <h2 id="device-title">设备</h2>
          <div class="actions">
            <button id="refresh" class="secondary" type="button">刷新</button>
            <button id="enrollment" class="secondary" type="button">生成登记码</button>
            <button id="begin-assignment" type="button" aria-expanded="false" aria-controls="assignment">批量分配</button>
          </div>
        </div>
        <div id="enrollment-details" class="enrollment" aria-labelledby="invite-title" hidden>
          <h3 id="invite-title">邀请设备</h3>
          <label class="invite-code-label" for="enrollment-code">一次性登记码</label>
          <div class="actions code-actions">
            <input id="enrollment-code" aria-describedby="expiry" readonly spellcheck="false">
            <button id="copy-code" type="button">复制登记码</button>
          </div>
          <p id="expiry" class="muted"></p>
          <div class="invite-methods">
            <div>
              <h4>登记这台 Mac</h4>
              <a id="open-mac-enrollment" href="vortoone-update://enroll" rel="noreferrer">打开本机登记窗口</a>
            </div>
            <div>
              <h4>邀请其他设备</h4>
              <button id="copy-invite-instructions" class="secondary" type="button">复制登记说明</button>
              <p class="muted">请将登记码另行私发。</p>
            </div>
          </div>
          <textarea id="invite-instructions" aria-label="登记说明" rows="5" readonly hidden></textarea>
          <details class="invite-compatibility">
            <summary>旧版本和其他系统</summary>
            <p>0.3.5 可在「版本管理」里直接登记。支持私密登记的 Windows 或 Ubuntu 版可在「版本管理」里按 <kbd>Ctrl+Alt+Shift+U</kbd>。</p>
          </details>
        </div>
        <form id="assignment" class="enrollment" aria-labelledby="assignment-label" hidden>
          <label id="assignment-label" for="target-version">为多台设备选择版本</label>
          <select id="target-version" required></select>
          <p id="selection-status" role="status">选择版本后勾选设备。</p>
          <div class="actions">
            <button id="apply-assignment" type="submit" disabled>应用分配</button>
            <button id="cancel-assignment" class="secondary" type="button">取消</button>
          </div>
        </form>
        <ul id="devices" class="list" aria-label="灰度设备"></ul>
        <p id="no-devices" class="empty" hidden>还没有已登记的设备。</p>
      </section>

      <section class="panel" aria-labelledby="release-title">
        <div class="section-header">
          <h2 id="release-title">灰度版本</h2>
        </div>
        <ul id="releases" class="list" aria-label="灰度版本"></ul>
        <p id="no-releases" class="empty" hidden>还没有可分配的灰度版本。</p>
      </section>
    </div>
    <noscript>请启用 JavaScript 后管理灰度更新。</noscript>
  </main>
</body>
</html>
