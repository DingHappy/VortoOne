# Include within the vortoone.com HTTPS server on both website nodes.
# Define vortoone_desktop_rollout in the http block on each node, pointing to
# the same rollout service over loopback or an authenticated private network.
location = /admin/releases {
    return 308 /admin/releases/;
}

location ^~ /admin/releases/ {
    proxy_pass http://vortoone_desktop_rollout;
    proxy_set_header Host vortoone.com;
    proxy_cache off;
}

location ^~ /api/desktop-rollout/ {
    proxy_pass http://vortoone_desktop_rollout;
    proxy_set_header Host vortoone.com;
    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 16k;
    access_log off;
}
