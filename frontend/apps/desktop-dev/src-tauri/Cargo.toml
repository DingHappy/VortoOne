[package]
name = "vortoone-desktop-dev"
version = "0.3.0-dev.6"
description = "VortoOne standalone desktop development channel"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dotenvy = "=0.15.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.5.4"

[profile.release]
strip = true
