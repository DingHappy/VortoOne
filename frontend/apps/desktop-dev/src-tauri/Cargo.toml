[package]
name = "vortoone-desktop-dev"
version = "0.3.0-dev.24"
description = "VortoOne standalone desktop development channel"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dotenvy = "=0.15.7"
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
tauri-plugin-updater = "=2.14.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[profile.release]
strip = true
